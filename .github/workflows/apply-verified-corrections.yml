name: Apply verified festival corrections

on:
  push:
    paths:
      - 'scripts/apply_verified_corrections.py'
      - 'scripts/add_verified_awards.py'
      - 'scripts/add_verified_awards_2012.py'
      - 'scripts/dedupe_verified_aliases.py'
      - '.github/workflows/apply-verified-corrections.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/apply_verified_corrections.py
      - run: python scripts/add_verified_awards.py
      - run: python scripts/add_verified_awards_2012.py
      - run: python scripts/dedupe_verified_aliases.py
      - name: Commit normalized records
        run: |
          if git diff --quiet -- data/records.json public/data/records.json; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/records.json public/data/records.json
          git commit -m "data: apply verified festival archive updates"
          git push
