name: Import verified Berlinale 2009 awards
on:
  push:
    branches: [main]
    paths:
      - 'scripts/add-berlin-2009.mjs'
      - '.github/workflows/import-verified-berlin-2009.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/add-berlin-2009.mjs
      - name: Commit synchronized records
        run: |
          if git diff --quiet -- data/records.json public/data/records.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/records.json public/data/records.json
          git commit -m 'data: add verified Berlinale 2009 major awards'
          git push
