<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小花的大宇宙 · 四大电影节档案</title>
<style>:root{--bg:#0b0c0f;--card:#14161b;--line:#2a2e37;--text:#f4efe6;--muted:#979eaa;--gold:#d7b267;--green:#7ec6a4}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,#20242c 0,#0b0c0f 34%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}.wrap{max-width:1400px;margin:auto;padding:32px 22px 70px}.hero{display:flex;justify-content:space-between;gap:20px}.eyebrow{color:var(--gold);letter-spacing:.16em;font-size:12px}h1{font:48px Georgia;margin:8px 0}.sub,.muted{color:var(--muted)}.live{border:1px solid #315143;background:#14221d;border-radius:12px;padding:11px 14px;color:var(--green);font-size:13px}.nav,.filters{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 16px}.nav button,.filters select,.filters input{background:var(--card);border:1px solid var(--line);color:var(--text);padding:11px 13px;border-radius:10px}.nav button{cursor:pointer}.nav .on{border-color:var(--gold);color:var(--gold)}.filters input{min-width:280px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}.stat{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px}.stat b{display:block;color:var(--gold);font-size:24px}.panel{background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{text-align:left;padding:12px 13px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}th{color:var(--gold)}.link{color:#a9c9ff;text-decoration:none}.pill{display:inline-block;border:1px solid #454b58;border-radius:999px;padding:2px 7px;font-size:11px}.foot{margin-top:15px;color:var(--muted);font-size:13px}@media(max-width:850px){.hero{display:block}.stats{grid-template-columns:1fr 1fr}h1{font-size:38px}}</style></head>
<body><div class="wrap"><div class="hero"><div><div class="eyebrow">XIAOHUA UNIVERSE · FILM FESTIVAL ATLAS</div><h1>小花的大宇宙</h1><div class="sub">四大电影节活跃档案：戛纳 · 威尼斯 · 柏林 · 洛迦诺。查询历届作品、入围与获奖、导演履历和摄影技术规格。</div></div><div class="live">● 活跃数据库结构<br><span class="muted" id="updated">读取中…</span></div></div>
<div class="nav"><button class="on" data-v="films">影片档案</button><button data-v="directors">导演获奖榜</button><button data-v="tech">技术规格</button><button data-v="sources">数据源</button></div>
<div class="filters"><input id="q" placeholder="搜索影片 / 导演 / 奖项 / 摄影机…"><select id="festival"><option value="">全部电影节</option><option>戛纳</option><option>威尼斯</option><option>柏林</option><option>洛迦诺</option></select><select id="year"><option value="">全部年份</option></select><select id="status"><option value="">入围 + 获奖</option><option value="winner">只看获奖</option><option value="nominee">只看入围</option></select></div>
<div class="stats"><div class="stat"><b id="nFilms">0</b>记录</div><div class="stat"><b id="nDirectors">0</b>导演</div><div class="stat"><b id="nWinners">0</b>获奖</div><div class="stat"><b id="nTech">0</b>含技术规格</div></div><div class="panel"><div class="tablewrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></div><div class="foot">官方电影节档案为获奖/入围事实主源；IMDb用于技术规格；豆瓣用于中文片名及导演中文译名参考；YouTube用于官方预告与采访。</div></div>
<script>
let DATA=[],view="films";const $=x=>document.getElementById(x);
async function load(){try{let r=await fetch("./data/records.json");if(!r.ok)throw 0;DATA=await r.json()}catch(e){DATA=[]}init()}
function init(){[...new Set(DATA.map(x=>x.year))].sort((a,b)=>b-a).forEach(y=>$("year").innerHTML+="<option>"+y+"</option>");$("updated").textContent="最后核对："+(DATA.map(x=>x.checkedAt).sort().pop()||"—");render()}
function filt(){let q=$("q").value.toLowerCase();return DATA.filter(x=>(!$("festival").value||x.festivalZh===$("festival").value)&&(!$("year").value||x.year==+$("year").value)&&(!$("status").value||x.status===$("status").value)&&(!q||[x.filmZh,x.filmEn,x.directorZh,x.directorEn,x.awardZh,x.awardEn,JSON.stringify(x.technical||{})].join(" ").toLowerCase().includes(q))).sort((a,b)=>b.year-a.year)}
function render(){let a=filt();$("nFilms").textContent=a.length;$("nDirectors").textContent=new Set(a.map(x=>x.directorEn)).size;$("nWinners").textContent=a.filter(x=>x.status==="winner").length;$("nTech").textContent=a.filter(x=>Object.keys(x.technical||{}).length).length;
if(view==="films"){$("thead").innerHTML="<tr><th>年份</th><th>电影节</th><th>影片</th><th>导演</th><th>奖项</th><th>来源</th></tr>";$("tbody").innerHTML=a.map(x=>"<tr><td>"+x.year+"</td><td>"+x.festivalZh+"</td><td><b>"+(x.filmZh||"—")+"</b><br><span class=muted>"+x.filmEn+"</span></td><td><b>"+(x.directorZh||"待核对")+"</b><br><span class=muted>"+x.directorEn+"</span></td><td>"+(x.awardZh||"主竞赛入围")+"<br><span class=pill>"+(x.status==="winner"?"获奖":"入围")+"</span></td><td><a class=link target=_blank href="+JSON.stringify(x.official)+">官方档案 ↗</a></td></tr>").join("")}
else if(view==="directors"){let m={};a.filter(x=>x.status==="winner").forEach(x=>{m[x.directorEn]??={zh:x.directorZh,en:x.directorEn,c:0,top:0,items:[]};m[x.directorEn].c++;if(/Palme|Golden Bear|Golden Lion|Golden Leopard|金棕榈|金熊|金狮|金豹/.test((x.awardEn||"")+" "+(x.awardZh||"")))m[x.directorEn].top++;m[x.directorEn].items.push(x.year+" "+x.festivalZh+"｜"+x.awardZh+"｜"+x.filmZh)});let d=Object.values(m).sort((x,y)=>y.c-x.c||y.top-x.top);$("thead").innerHTML="<tr><th>导演</th><th>获奖次数</th><th>最高奖次数</th><th>获奖履历</th></tr>";$("tbody").innerHTML=d.map(x=>"<tr><td><b>"+x.zh+"</b><br><span class=muted>"+x.en+"</span></td><td>"+x.c+"</td><td>"+x.top+"</td><td>"+x.items.join("<br>")+"</td></tr>").join("")}
else if(view==="tech"){$("thead").innerHTML="<tr><th>影片</th><th>摄影机</th><th>镜头</th><th>画幅</th><th>拍摄 / DI</th><th>声音</th></tr>";let d=a.filter(x=>Object.keys(x.technical||{}).length);$("tbody").innerHTML=d.length?d.map(x=>"<tr><td>"+x.filmZh+"</td><td>"+(x.technical.camera||"—")+"</td><td>"+(x.technical.lens||"—")+"</td><td>"+(x.technical.aspect||"—")+"</td><td>"+(x.technical.process||"—")+"</td><td>"+(x.technical.sound||"—")+"</td></tr>").join(""):"<tr><td colspan=6 class=muted>当前已核验数据中暂无技术规格，字段结构已就绪。</td></tr>"}
else{$("thead").innerHTML="<tr><th>来源</th><th>用途</th><th>原则</th></tr>";$("tbody").innerHTML="<tr><td>电影节官方</td><td>入围 / 获奖</td><td>最高优先级事实源</td></tr><tr><td>IMDb</td><td>Technical Specifications</td><td>绑定 IMDb ID 后核验</td></tr><tr><td>豆瓣</td><td>中文片名 / 导演中文名</td><td>中文映射参考</td></tr><tr><td>YouTube</td><td>官方预告 / 采访</td><td>优先官方频道</td></tr>"}}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("on"));b.classList.add("on");view=b.dataset.v;render()});["q","festival","year","status"].forEach(id=>$(id).addEventListener(id==="q"?"input":"change",render));load();
</script></body></html>
